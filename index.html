<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Family Library - 3D Cozy Personal Library</title>
    <meta name="description" content="Browse and manage your personal book collection through an interactive, cozy 3D low-poly scene or 2D catalog." />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D WebGL Canvas Layer -->
      <div id="canvas-container"></div>

      <!-- UI Overlays (Auth, List View, Shelf Overlays, Prompts) -->
      <div id="ui-overlay">
        <!-- Persistent Top Navigation Bar will be rendered here -->
        <header id="top-nav-container"></header>
      </div>

      <!-- Screen Transition Fade Overlay -->
      <div id="screen-fade"></div>

      <!-- Modal Dialog Root -->
      <div id="modal-root"></div>

      <!-- Toast Notifications Root -->
      <div id="toast-root"></div>

      <!-- Cozy Animated Loading Screen -->
      <div id="app-loading-screen" class="loading-screen">
        <div class="loading-card">
          <div class="loading-book-anim">
            <div class="book-spine"></div>
            <div class="book-page page-1"></div>
            <div class="book-page page-2"></div>
            <div class="book-page page-3"></div>
          </div>
          <h2 class="loading-title">Family Library</h2>
          <p id="loading-status-text" class="loading-sub">Preparing cozy 3D library...</p>
          <div class="loading-bar-track">
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
